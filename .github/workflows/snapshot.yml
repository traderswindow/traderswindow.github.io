# Rezumatul zilnic al pieței (vezi .github/snapshot.mjs). Rulează în fiecare zi la 06:10 UTC.
name: Daily market snapshot
on:
  schedule:
    - cron: "10 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: snapshot
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/snapshot.mjs .
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "Daily market snapshot"
          git push -q
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || true
